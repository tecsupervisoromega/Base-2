name: base2-ddd

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: base2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-base2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-base2_dev}
      POSTGRES_DB: ${POSTGRES_DB:-base2_ddd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-base2} -d ${POSTGRES_DB:-base2_ddd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: base2-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-base2}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-base2_dev_minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: base2-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-base2} ${MINIO_ROOT_PASSWORD:-base2_dev_minio};
      mc mb --ignore-existing local/${MINIO_BUCKET:-base2};
      mc anonymous set download local/${MINIO_BUCKET:-base2};
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: base2-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
